<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель управления | Библиотека</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/main-layout.css">
</head>
<body>

<div class="app-container">
    <aside class="app-sidebar">
        <div class="sidebar-header">
            <a href="main.html" class="sidebar-logo-link">Корпоративная Библиотека</a>
        </div>
        <nav class="sidebar-nav">
            <div id="common-block">
                <a href="#окно-каталога-книг" class="nav-link active">Каталог книг</a>
                <a href="#курсы-сотрудника" class="nav-link">Моё обучение</a>
            </div>

            <div id="admin-block">
                <div class="nav-section-title">УПРАВЛЕНИЕ (HR)</div>
                <a href="#" class="nav-link">Добавить материал</a>
                <a href="#думаем" class="nav-link">Категории</a>
            </div>

            <div id="superuser-block">
                <div class="nav-section-title">АДМИНИСТРИРОВАНИЕ</div>
                <a href="#окно-с-списком-всех-польз" class="nav-link">Назначить админов</a>
            </div>
        </nav>

        <div class="sidebar-footer">
            <span id="user-role-badge" class="badge">Роль: Загрузка...</span>
            <button id="logout-btn" class="btn">Выйти</button>
        </div>
    </aside>

    <main class="app-content">
        <header class="content-header">
            <h1 id="page-title">Каталог материалов</h1>
            <!--Добавление категории -->
            <div class="header-actions" style="display: flex; align-items: center; gap: 16px;">
                <button id="add-category-btn" class="btn-action-blue" style="display: none;">
                    <span>+</span> Добавить категорию
                </button>

                <div class="user-profile">
                    <span id="user-email">user@company.com</span>
                </div>
            </div>
        </header>

        <section class="content-body">
            <p>Здесь будет отображаться контент выбранной вкладки.</p>
        </section>
    </main>
</div>
<!-- Создание категории с выводом модального окна -->
<div id="category-modal" class="modal-backdrop hidden">
    <div class="modal-window">
        <div class="modal-header">
            <h2>Создание категории</h2>
            <button id="close-modal-icon" class="btn-close">&times;</button>
        </div>

        <form id="category-form">
            <div class="input-group">
                <label for="category-name">Название категории (обязательно)</label>
                <input type="text" id="category-name" required placeholder="Например: Дизайн">
            </div>

            <div class="input-group">
                <label for="category-description">Описание (необязательно)</label>
                <textarea id="category-description" rows="3" placeholder="Материалы по по дизайну"></textarea>
            </div>

            <div class="modal-footer">
                <button type="button" id="cancel-category-btn" class="btn-outline">Отмена</button>
                <button type="submit" class="btn-action-blue">Создать</button>
            </div>
        </form>
    </div>
</div>

<script src="../js/index.js"></script>
<script src="../config.js"></script>
</body>
</html>
