<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель управления | Библиотека</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/main-layout.css">
</head>
<body>

<div class="app-container">
    <aside class="app-sidebar">
        <div class="sidebar-header">
            <h2>Корп.Библиотека</h2>
        </div>
        <!-- Панель на будущее -->
        <nav class="sidebar-nav">
            <a href="#catalog" class="nav-item active">Каталог книг</a>
            <a href="#my-courses" class="nav-item">Моё обучение</a>

            <div id="admin-block" class="nav-section">

                <a href="#upload" class="nav-item">Добавить материал</a>
                <a href="#categories" class="nav-item">Категории</a>

                <a href="#manage-admins" class="nav-item">Назначить админов</a>

            <button id="logout-btn" class="btn">Выйти</button>

    <main class="app-content">

            <h1 id="page-title">Каталог материалов</h1>
            <div class="user-profile">

            <p>Здесь будет отображаться контент выбранной вкладки.</p>
