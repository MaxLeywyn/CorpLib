<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход | Корпоративная библиотека</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body>

<div class="auth-wrapper">
    <div class="auth-card">

        <div id="login-view">
            <h1 class="auth-title">Вход</h1>
            <p class="auth-subtitle">Используйте корпоративный аккаунт</p>

            <form id="login-form">
                <div class="form-group">
                    <label for="login-email">Логин</label>
                    <input type="email" id="login-email" required placeholder="name@company.com">
                </div>

                <div class="form-group">
                    <label for="login-password">Пароль</label>
                    <input type="password" id="login-password" required placeholder="Введите пароль">
                </div>

                <button type="submit" class="btn btn-primary auth-btn">Далее</button>
            </form>

            <a href="#" class="toggle-link" id="show-register">Нет аккаунта? Зарегистрируйтесь</a>
        </div>

        <div id="register-view" class="hidden">
            <h1 class="auth-title">Регистрация</h1>
            <p class="auth-subtitle">Создайте новый профиль сотрудника</p>

            <form id="register-form">
                <div class="form-group">
                    <label for="register-name">ФИО</label>
                    <input type="text" id="register-name" required placeholder="Иванов Иван Иванович">
                </div>

                <div class="form-group">
                    <label for="register-email">Логин</label>
                    <input type="email" id="register-email" required placeholder="name@company.com">
                </div>

                <div class="form-group">
                    <label for="register-password">Пароль</label>
                    <input type="password" id="register-password" required placeholder="Придумайте пароль">
                </div>

                <button type="submit" class="btn btn-primary auth-btn">Зарегистрироваться</button>
            </form>

            <a href="#" class="toggle-link" id="show-login">Уже есть аккаунт? Войти</a>
        </div>

    </div>
</div>

<script src="../js/auth.js"></script>
</body>
</html>
